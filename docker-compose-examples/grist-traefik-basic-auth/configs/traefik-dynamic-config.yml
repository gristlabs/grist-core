http:
  # Declaring the user list
  middlewares:
    grist-basic-auth:
      basicAuth:
        # The header that Grist will listen for authenticated usernames on.
        headerField: "X-Forwarded-User"
        # This is the list of users, in the format username:password.
        # Note that the username is used as the account email in Grist.
        # Passwords can be created using `htpasswd`
        # E.g: `htpasswd -nB test@example.com`
        users:
          # The default username is "test@example.com". The default password is "test".
          - "test@example.com:$apr1$H6uskkkW$IgXLP6ewTrSuBkTrqE8wj/"
