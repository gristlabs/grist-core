services:
  grist:
    image: ${GRIST_IMAGE:-gristlabs/grist:latest}
    restart: on-failure
    environment:
      # Set DEBUG=1 for verbose logs.
      DEBUG: ${DEBUG:-}
      # Postgres database setup
      TYPEORM_DATABASE: grist
      TYPEORM_USERNAME: grist
      TYPEORM_HOST: grist-db
      TYPEORM_LOGGING: false
      TYPEORM_PASSWORD: ${DATABASE_PASSWORD:-grist-db-password}
      TYPEORM_PORT: 5432
      TYPEORM_TYPE: postgres

      # Redis setup
      REDIS_URL: redis://grist-redis

      # S3 storage (RustFS here). The bucket must have versioning enabled.
      # Despite the MINIO names, these work with any S3-compatible store.
      GRIST_DOCS_MINIO_ACCESS_KEY: grist
      GRIST_DOCS_MINIO_SECRET_KEY: ${RUSTFS_PASSWORD:-grist-rustfs-password}
      GRIST_DOCS_MINIO_USE_SSL: 0
      GRIST_DOCS_MINIO_BUCKET: grist-docs
      GRIST_DOCS_MINIO_ENDPOINT: grist-rustfs
      GRIST_DOCS_MINIO_PORT: 9000

      # External Storage for attachments
      GRIST_EXTERNAL_ATTACHMENTS_MODE: "snapshots"

      # Keycloak setup, via OpenID Connect. The realm and client come from
      # ./configs/keycloak, imported at Keycloak's first startup.
      GRIST_OIDC_IDP_ISSUER: https://auth.${GRIST_DOMAIN:-grist.localhost}/realms/grist
      GRIST_OIDC_IDP_SCOPES: openid profile email
      GRIST_OIDC_IDP_CLIENT_ID: gristclient
      GRIST_OIDC_IDP_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-gristclientsecret}
      # Allow self-signed certificates, so that Grist can talk to Keycloak
      # through Traefik locally. REMOVE THIS IF HOSTING ON THE INTERNET.
      NODE_TLS_REJECT_UNAUTHORIZED: 0

      # Forces Grist to only use a single team called 'my-grist-team'
      GRIST_SINGLE_ORG: my-grist-team   # alternatively, GRIST_ORG_IN_PATH: "true" for multi-team operation
      # Force users to login (disable anonymous access)
      GRIST_FORCE_LOGIN: true
      # Base URL Grist redirects to when navigating. Change GRIST_DOMAIN to your domain.
      APP_HOME_URL: https://${GRIST_DOMAIN:-grist.localhost}
      # Email of the administrator account. Must match a user in Keycloak
      # (see ./configs/keycloak/grist-realm.json).
      GRIST_ADMIN_EMAIL: ${GRIST_ADMIN_EMAIL:-test@example.org}

      # Run as the full edition of Grist, starting a 30-day free trial. To
      # continue past the trial, paste an activation key in the Admin Panel's
      # Edition section. Because the edition is set here, it cannot be
      # changed in the admin panel.
      GRIST_SERVER_EDITION: full
      # The MCP server, a full-Grist feature that is off unless enabled.
      # MCP clients connect as OAuth apps and register themselves via
      # Dynamic Client Registration, so those need enabling too.
      GRIST_MCP_ENABLED: true
      GRIST_ENABLE_OIDC_SERVER: true
      GRIST_ENABLE_OIDC_DCR: true
      # Hosts trusted to identify MCP clients via Client ID Metadata
      # Documents (CIMD), instead of registering. Adjust to your clients.
      GRIST_OIDC_CIMD_ALLOWED_HOSTS: claude.ai,cursor.com,cursor.sh,vscode.dev,openai.com,chatgpt.com
      # More full-Grist features, each needing an external account.
      # AI Assistant, with your AI provider's key:
      # ASSISTANT_API_KEY: your-provider-key
      # Email notifications, with your SMTP server:
      # GRIST_NODEMAILER_CONFIG: '{"host": "smtp.example.com", "port": 465, "secure": true, "auth": {"user": "...", "pass": "..."}}'
      # GRIST_NODEMAILER_SENDER: '{"name": "Grist", "email": "grist@example.com"}'
    volumes:
      # Where to store persistent data, such as documents.
      - ${PERSIST_DIR:-./persist}/grist:/persist
    labels:
      - "traefik.http.services.grist.loadbalancer.server.port=8484"
      - "traefik.http.routers.grist.rule=Host(`${GRIST_DOMAIN:-grist.localhost}`)"
      - "traefik.http.routers.grist.tls.certresolver=letsencrypt"
    depends_on:
      grist-db:
        condition: service_started
      grist-redis:
        condition: service_started
      grist-rustfs:
        condition: service_started
      rustfs-setup:
        condition: service_completed_successfully
      # Grist contacts Keycloak at startup to set up OpenID Connect, so it
      # must wait for Keycloak to be ready.
      keycloak:
        condition: service_healthy

  grist-db:
    image: postgres:alpine
    environment:
        POSTGRES_DB: grist
        POSTGRES_USER: grist
        POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-grist-db-password}
    volumes:
      # Postgres 18+ docker images keep data in a version-specific
      # subdirectory, and require mounting this directory rather than the
      # data directory itself.
      - ${PERSIST_DIR:-./persist}/postgres:/var/lib/postgresql

  grist-redis:
    image: redis:alpine
    volumes:
      - ${PERSIST_DIR:-./persist}/redis:/data

  grist-rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: grist
      RUSTFS_SECRET_KEY: ${RUSTFS_PASSWORD:-grist-rustfs-password}
    volumes:
      - ${PERSIST_DIR:-./persist}/rustfs:/data
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully

  # Docker creates RustFS's data directory owned by root, but RustFS runs as
  # UID 10001 and can't write there. This one-off step, run as root, gives
  # the directory to UID 10001 before RustFS starts.
  rustfs-permissions:
    image: rustfs/rustfs:latest
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/data"]
    volumes:
      - ${PERSIST_DIR:-./persist}/rustfs:/data

  # Creates the versioned bucket. Only needed for this example; safe to remove.
  rustfs-setup:
    image: rustfs/rc:latest
    environment:
      RUSTFS_PASSWORD: ${RUSTFS_PASSWORD:-grist-rustfs-password}
    depends_on:
      grist-rustfs:
        condition: service_started
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      rc alias set rustfs http://grist-rustfs:9000 grist \"$$RUSTFS_PASSWORD\" &&
      rc bucket create --ignore-existing rustfs/grist-docs &&
      rc bucket version enable rustfs/grist-docs
      "

  keycloak-db:
    image: postgres:alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-keycloak-db-password}
    volumes:
      - ${PERSIST_DIR:-./persist}/keycloak-postgres:/var/lib/postgresql
    healthcheck:
      # Keycloak fails at startup if its database is not yet accepting
      # connections, which takes a few seconds on the first run.
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.0
    volumes:
      # The realm and client Grist needs, imported at first startup only.
      - ./configs/keycloak:/opt/keycloak/data/import
    command:
      - start-dev
      - --import-realm
    environment:
      # Credentials for Keycloak's admin console.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DATABASE_PASSWORD:-keycloak-db-password}
      KC_DB_USERNAME: keycloak
      KC_DB_SCHEMA: public
      KC_HEALTH_ENABLED: true
      # Keycloak lives behind Traefik, which terminates TLS.
      KC_HOSTNAME: https://auth.${GRIST_DOMAIN:-grist.localhost}
      KC_PROXY_HEADERS: xforwarded
      # Interpolated into the imported realm (configs/keycloak/grist-realm.json).
      GRIST_DOMAIN: ${GRIST_DOMAIN:-grist.localhost}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-gristclientsecret}
    labels:
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.http.routers.keycloak.rule=Host(`auth.${GRIST_DOMAIN:-grist.localhost}`)"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # This healthcheck is a way to wait for Keycloak to be ready. It only checks Keycloak's health once since healthchecks in KC are sometimes weird : https://github.com/keycloak/keycloak/discussions/10575
      test: ["CMD-SHELL", "if [ ! -f /tmp/health.txt ]; then touch /tmp/health.txt && exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi; else echo \"Healthcheck already executed\"; fi"]

  traefik:
    image: traefik:latest
    # Command-line based configuration, in the style of Traefik's own
    # examples, e.g. https://doc.traefik.io/traefik/getting-started/docker/
    command:
      # Read routing config from docker labels.
      - "--providers.docker"
      # A secure entrypoint using TLS encryption.
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      # An insecure entrypoint that redirects to the secure one.
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Automatic certificates. Let's Encrypt requires a real email
      # (it refuses the placeholder), and uses it for expiry notices.
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-my_email@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    ports:
      # HTTP Ports
      - "80:80"
      - "443:443"
    volumes:
      # Certificate storage.
      - ${PERSIST_DIR:-./persist}/acme:/acme
      # Traefik reads routing labels via this socket. If you run Docker as root, that grants
      # this container root access; consider rootless Docker, a socket proxy, or a config file:
      # https://doc.traefik.io/traefik/providers/docker/#docker-api-access
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      default:
        aliases:
          # Enables Grist to resolve Keycloak's domain to Traefik when
          # setting up OpenID Connect.
          - auth.${GRIST_DOMAIN:-grist.localhost}
    depends_on:
      - grist
      - keycloak
